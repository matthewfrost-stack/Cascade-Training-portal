name: Monthly Compliance Snapshot
on:
  schedule:
    # 06:00 UTC on the 1st of each month. Saves each home's compliance figures
    # for the trend on the compliance report. Sends no emails.
    - cron: '0 6 1 * *'
  workflow_dispatch: # Allows a manual run from the GitHub Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Save this month's compliance snapshot
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set. Add your Vercel production URL to GitHub Secrets as APP_URL."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 320 -X GET "$APP_URL/api/reports/compliance/snapshot" \
            -H "Authorization: Bearer $CRON_SECRET"
